<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111318">
    <title>Sin conexión · EET N° 2</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6; color: #111318;
        }
        .card {
            width: 100%; max-width: 26rem; overflow: hidden; border-radius: .75rem;
            border: 1px solid #e5e7eb; background: #fff; box-shadow: 0 10px 25px rgba(17, 19, 24, .14);
        }
        .head { background: #111318; border-bottom: 2px solid #dc2626; color: #fff; padding: 1.25rem 1.5rem; text-align: center; }
        .shield { height: 4rem; width: auto; display: block; margin: 0 auto .6rem; object-fit: contain; }
        .badge {
            display: inline-block; border-radius: .25rem; background: #dc2626; color: #ffffff;
            border: 1px solid rgba(140, 240, 100, .6);
            padding: .15rem .6rem; font-size: .75rem; font-weight: 800; text-transform: uppercase;
        }
        .head h1 { margin: .45rem 0 0; font-size: 1rem; color: #8cf064; }
        .body { padding: 1.5rem; text-align: center; }
        .body h2 { margin: 0 0 .5rem; font-size: 1.15rem; }
        .body p { margin: 0 0 1rem; font-size: .9rem; line-height: 1.5; color: #4b5563; }
        button {
            width: 100%; cursor: pointer; border: 0; border-radius: .375rem; background: #dc2626; color: #fff;
            padding: .7rem 1rem; font-size: .9rem; font-weight: 600;
        }
        button:hover { background: #b91c1c; }
        @media (prefers-color-scheme: dark) {
            body { background: #0c0e12; color: #f3f4f6; }
            .card { background: #141820; border-color: #282f3d; }
            .body p { color: #9ca3af; }
            button { background: #dc2626; }
            button:hover { background: #b91c1c; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="head">
            <img src="icons/logo-eet2.png" alt="Escudo EET N° 2" class="shield">
            <span class="badge">EET N° 2</span>
            <h1>Prof. Jesús Raúl Salazar · Sistema de Asistencia</h1>
        </div>
        <div class="body">
            <h2>Sin conexión a internet</h2>
            <p>
                No pudimos comunicarnos con el servidor. Para proteger los datos de los estudiantes,
                la asistencia solo se puede consultar y registrar con conexión.
                Revisá tu red e intentá nuevamente.
            </p>
            <button type="button" onclick="location.reload()">Reintentar</button>
        </div>
    </main>
</body>
</html>
